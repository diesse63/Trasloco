<section class="servizi-panel">
    <style>
        .servizi-panel {
            --s-accent: #0f766e;
            --s-accent-2: #c2410c;
            --s-card: #fff;
            --s-line: #d6d3d1;
            --s-bg: #fffcf5;
            background: linear-gradient(145deg, rgba(15, 118, 110, 0.08), rgba(194, 65, 12, 0.08));
            border: 1px solid var(--s-line);
            border-radius: 16px;
            padding: 16px;
        }

        .servizi-toolbar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px;
            background: var(--s-bg);
            border: 1px solid var(--s-line);
            border-radius: 12px;
        }

        .servizi-card {
            background: var(--s-card);
            border: 1px solid var(--s-line);
            border-radius: 12px;
            padding: 12px;
        }

        .servizi-modal-form {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .servizi-card input,
        .servizi-card textarea,
        .servizi-card select,
        .servizi-modal input,
        .servizi-modal textarea,
        .servizi-modal select,
        .servizi-toolbar input {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--s-line);
            border-radius: 8px;
            padding: 8px;
            font: inherit;
        }

        .servizi-card textarea,
        .servizi-modal textarea {
            min-height: 56px;
            resize: vertical;
        }

        .azioni {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .azioni button,
        .servizi-toolbar button {
            border: 1px solid var(--s-line);
            border-radius: 999px;
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 600;
            background: #fff;
        }

        .azioni .primary,
        .servizi-toolbar button {
            background: var(--s-accent);
            color: #fff;
            border-color: var(--s-accent);
        }

        .tabella-wrap {
            overflow: auto;
            max-height: 250px;
            border: 1px solid var(--s-line);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            border-bottom: 1px solid var(--s-line);
            text-align: left;
            padding: 7px;
            vertical-align: top;
        }

        th {
            position: sticky;
            top: 0;
            background: #fafaf9;
            z-index: 10;
            box-shadow: 0 1px 0 var(--s-line);
        }

        .azioni-cell {
            padding: 0 !important;
            vertical-align: stretch;
        }

        .azioni-cell .btn-group {
            display: flex;
            height: 100%;
            min-height: 48px;
        }

        .azioni-cell .mini-btn {
            flex: 1;
            margin: 0;
            border: none;
            border-radius: 0;
            border-left: 1px solid var(--s-line);
            height: 100%;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .azioni-cell .mini-btn:first-child {
            border-left: none;
        }

        .mini-btn {
            border: 1px solid var(--s-line);
            border-radius: 6px;
            background: white;
            padding: 3px 7px;
            cursor: pointer;
            margin-right: 4px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .servizi-msg {
            min-height: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .servizi-msg.ok {
            color: #047857;
        }

        .servizi-msg.err {
            color: #b91c1c;
        }

        .servizi-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .servizi-head h3 {
            margin: 0;
        }

        .servizi-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 25, 23, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            z-index: 1000;
        }

        .servizi-modal-overlay.is-hidden {
            display: none;
        }

        .servizi-modal {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            border: 1px solid var(--s-line);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 14px 34px rgba(28, 25, 23, 0.24);
        }

        .servizi-modal.is-hidden {
            display: none;
        }

        .servizi-modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .servizi-modal-top h4 {
            margin: 0;
        }

        .close-modal {
            border: 1px solid var(--s-line);
            border-radius: 8px;
            background: #fff;
            padding: 5px 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .scatole-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin: 10px 0 12px;
            padding: 10px;
            border: 1px solid var(--s-line);
            border-radius: 10px;
            background: #fffcf5;
        }

        .scatole-filters label {
            display: grid;
            gap: 4px;
            font-weight: 600;
            color: #44403c;
        }

        .stato-cell {
            white-space: nowrap;
        }

        .stato-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .stato-dot.is-open {
            background: #16a34a;
        }

        .stato-dot.is-closed {
            background: #dc2626;
        }

        .btn-toggle-aperta {
            background-color: #16a34a !important;
            color: white !important;
        }

        .btn-toggle-chiusa {
            background-color: #dc2626 !important;
            color: white !important;
        }

        .status-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-icon svg {
            width: 14px;
            height: 14px;
        }

        .btn-toggle-aperta .status-icon { color: #16a34a; }
        .btn-toggle-chiusa .status-icon { color: #dc2626; }

        .scatola-popup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            border: 1px dashed var(--s-line);
            border-radius: 8px;
            background: #fffcf5;
        }

        .scatole-toggle .toggle-btn {
            border: 1px solid var(--s-line);
            border-radius: 999px;
            background: white;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 700;
            color: #475569;
        }

        .scatole-toggle .toggle-btn.is-active {
            background: var(--s-accent);
            color: white;
            border-color: var(--s-accent);
        }

        .scatole-toggle .toggle-badge {
            display: inline-block;
            min-width: 20px;
            padding: 2px 6px;
            margin-left: 8px;
            border-radius: 999px;
            background: rgba(0,0,0,0.06);
            color: #111827;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
        }

        .scatole-toggle .toggle-btn.is-active .toggle-badge {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .scatola-status-hint {
            margin: 0;
            color: #57534e;
            font-size: 13px;
        }

        .griglia-oggetti {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .item-card {
            background: #fff;
            border: 1px solid var(--s-line);
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>

    <div id="serviziMsg" class="servizi-msg"></div>

    <article class="servizi-card">
        <section class="scatole-filters" aria-label="Filtri scatole">
            <label>
                Numero scatola
                <select id="filterScatolaNome">
                    <option value="">Numero</option>
                </select>
            </label>
            <label>
                Stanza
                <select id="filterScatolaStanza">
                    <option value="">Tutte le stanze</option>
                </select>
            </label>
            <label>
                Mobile
                <select id="filterScatolaMobile">
                    <option value="">Tutti i mobili</option>
                </select>
            </label>
            <div style="display:flex; gap:8px; align-items:flex-end;">
                <div id="filterScatolaToggle" class="scatole-toggle" style="display:flex; gap:6px;">
                    <button type="button" data-state="" class="toggle-btn" title="Tutte le scatole">Tutte <span class="toggle-badge">0</span></button>
                    <button type="button" data-state="open" class="toggle-btn" title="Solo aperte">Aperte <span class="toggle-badge">0</span></button>
                    <button type="button" data-state="closed" class="toggle-btn" title="Solo non riaperte">Non riaperte <span class="toggle-badge">0</span></button>
                </div>
                <div style="flex:1;">
                    <button id="btnResetScatolaFilters" type="button" class="mini-btn" style="width:100%; height:38px; margin-bottom:0; font-weight:700; border-color:var(--s-accent); color:var(--s-accent);">Svuota Filtri</button>
                </div>
            </div>
        </section>
        <div class="tabella-wrap">
            <table>
                <thead>
                    <tr><th>Azioni</th><th>Numero</th><th>Stanze presenti</th><th>Mobili</th><th>Quantità oggetti</th><th>Stato</th></tr>
                </thead>
                <tbody id="tbScatole"></tbody>
            </table>
        </div>
    </article>

    <section class="servizi-card" style="margin-top: 16px;">
        <h4 style="margin: 0 0 12px;">Galleria Oggetti (filtrata)</h4>
        <div id="grigliaOggettiScatole" class="griglia-oggetti"></div>
    </section>

    <div id="gestionePhotoViewer" class="gestione-photo-viewer" hidden>
        <button id="gestionePhotoViewerClose" type="button" class="gestione-photo-viewer-close" aria-label="Chiudi foto">Chiudi</button>
        <img id="gestionePhotoViewerImg" alt="Foto oggetto ingrandita">
    </div>

    <div id="serviziModalOverlay" class="servizi-modal-overlay is-hidden" aria-hidden="true">
        <div id="modalScatole" class="servizi-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitleScatole">
            <div class="servizi-modal-top">
                <h4 id="modalTitleScatole">Gestione Scatola</h4>
                <button class="close-modal" type="button" data-close-modal="scatole">Chiudi</button>
            </div>
            <form id="formScatole" class="servizi-modal-form">
                <input type="hidden" id="scatolaId">
                <label id="scatolaNomeField">
                    Nome
                    <input id="scatolaNome" type="text">
                </label>
                <label>
                    Stanze collegate (sola lettura)
                    <textarea id="scatolaStanza" readonly></textarea>
                </label>
                <label>
                    Mobili collegati (sola lettura)
                    <textarea id="scatolaMobile" readonly></textarea>
                </label>
                <label>
                    Foto
                    <input id="scatolaFotoFile" type="file" accept="image/*" capture="environment" style="display:none;">
                    <div class="azioni">
                        <button id="btnScatolaFoto" type="button">Seleziona/Aggiorna Foto</button>
                        <button id="btnRimuoviScatolaFoto" type="button">Rimuovi Foto</button>
                    </div>
                    <small id="scatolaFotoInfo">Nessuna foto selezionata</small>
                    <img id="scatolaFotoPreview" alt="Anteprima foto scatola" style="display:none; margin-top:8px; max-width:100%; max-height:140px; border:1px solid var(--s-line); border-radius:8px;">
                </label>
                <label>
                    Note
                    <textarea id="scatolaNote"></textarea>
                </label>
                <div id="scatolaQuickActions" class="scatola-popup-actions" style="display:none;">
                    <button type="button" id="btnScatolaCmdPrint" data-action="print-scatola-label">Stampa Etichetta</button>
                    <button type="button" id="btnScatolaCmdFoto" data-action="focus-scatola-foto">Gestisci Foto</button>
                    <button type="button" id="btnScatolaCmdToggleStato" data-action="toggle-scatola-stato">Chiudi Scatola</button>
                    <button type="button" id="btnScatolaCmdDelete" data-action="delete-scatola">Elimina Scatola</button>
                </div>
                <p id="scatolaStatusHint" class="scatola-status-hint" style="display:none;"></p>
                <div class="azioni">
                    <button class="primary" type="submit" id="submitScatola">Salva</button>
                    <button type="button" id="resetScatola">Annulla Modifica</button>
                </div>
            </form>
        </div>
    </div>
</section>
